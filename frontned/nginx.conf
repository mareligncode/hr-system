# ─── HR System — Nginx config for the frontend container ─────────────────────
#
# This config does two things:
#   1. Serves the React SPA — any path that doesn't match a real file falls
#      back to index.html so react-router handles routing client-side.
#   2. Proxies /api/* to the backend container — so the browser only ever
#      talks to one origin and there are no CORS issues in production.

server {
    listen 80;
    server_name _;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header X-XSS-Protection       "1; mode=block"         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── API proxy — forwards /api/* to the backend service ───────────────────
    # "backend" matches the service name in docker-compose.yml
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        # Required for WebSocket support (Phase 12 — Socket.io)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Pass real client info to the backend
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — increase if payroll/report generation takes long
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Don't buffer large responses (file downloads, exports)
        proxy_buffering off;
    }

    # ── Uploaded files proxy (served via backend /uploads) ───────────────────
    location /uploads/ {
        proxy_pass       http://backend:5000;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }

    # ── Static assets — long cache since Vite adds content hashes ────────────
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        root    /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback — all other paths serve index.html ──────────────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }

    # ── Error pages ──────────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
