services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: hotel_hr_database
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hr_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DB_HOST=db
      - DB_USER=hr_user
      - DB_PASSWORD=hr_password
      - DB_NAME=hotel_hr_database
      - DB_PORT=3306
      - JWT_SECRET=super_secret_jwt_key_here_please_change_in_production
      - NODE_ENV=development
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontned
      args:
        - VITE_API_URL=http://localhost:5000/api
    restart: always
    ports:
      - "5173:80"
    volumes:
      - ./frontned:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - backend

volumes:
  db_data:
